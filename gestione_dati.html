<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Generatore Programma Settimanale</title>
<script src="xlsx.full.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; margin: 30px; max-width: 900px; }
  h2 { margin-top: 40px; }
  .blocco { border: 1px solid #ccc; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
  .settimana-giorni { display: flex; gap: 8px; margin-top: 10px; }
  .giorno-box {
    flex: 1; text-align: center; padding: 10px 5px; border: 1px solid #999;
    border-radius: 6px; background: #f4f4f4; font-size: 13px;
  }
  .giorno-box.oggi { background: #fff3b0; border: 2px solid #e6b800; font-weight: bold; }
  .sezioni-tabs { display: flex; gap: 8px; margin-top: 15px; flex-wrap: wrap; }
  .sezione-tab {
    padding: 8px 14px; border: 1px solid #666; border-radius: 6px; cursor: pointer; background: #eee;
  }
  .sezione-tab.attiva { background: #4a90d9; color: white; border-color: #4a90d9; }
  .griglia-giorni { display: flex; gap: 8px; margin-top: 15px; }
  .giorno-cella {
    flex: 1; border: 1px solid #999; border-radius: 6px; padding: 10px; min-height: 80px; background: #fafafa;
  }
  .giorno-cella.oggi { background: #fffbe6; }
  .giorno-cella h4 { margin: 0 0 6px 0; font-size: 13px; }
  .attivita-item { font-size: 12px; background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 5px; margin-bottom: 5px; cursor: pointer; }
  .attivita-item:hover { background: #f0f7ff; }
  .attivita-item.compilata { border: 2px solid #4caf50; background: #f3fff3; }
  .attivita-item .segno-ok { color: #4caf50; font-weight: bold; float: right; }
  .nessuna { font-size: 12px; color: #999; font-style: italic; }
  #avviso-scartate { color: #a33; font-size: 13px; margin-top: 10px; white-space: pre-wrap; }

  /* ===== MODALE FORM ATTIVITÀ ===== */
  #overlayModale {
    display: none; position: fixed; top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;
  }
  #overlayModale.aperto { display: flex; }
  #modaleForm {
    background: white; border-radius: 10px; padding: 25px; width: 550px; max-height: 85vh; overflow-y: auto;
  }
  #modaleForm h3 { margin-top: 0; }
  .campo-form { margin-bottom: 14px; }
  .campo-form label { display:block; font-weight: bold; font-size: 13px; margin-bottom: 4px; }
  .campo-form input[type=text], .campo-form textarea {
    width: 100%; box-sizing: border-box; padding: 6px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px;
  }
  .campo-form textarea { min-height: 60px; resize: vertical; }
  .scelta-radio { display: flex; gap: 15px; font-size: 13px; }
  .scelta-radio label { font-weight: normal; display:flex; align-items:center; gap:4px; }
  .riga-doppia { display:flex; gap: 15px; }
  .riga-doppia .campo-form { flex:1; }
  .azioni-modale { display:flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .azioni-modale button { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; }
  #btnSalva { background:#4a90d9; color:white; }
  #btnAnnulla { background:#ddd; }
</style>
</head>
<body>

<h2>1. Carica il file Excel</h2>
<input type="file" id="fileExcel" accept=".xlsx,.xls">

<h2>2. Seleziona la settimana</h2>
<div class="blocco">
  <label>Scegli un giorno qualsiasi della settimana desiderata: </label>
  <input type="date" id="dataRiferimento">
  <div class="settimana-giorni" id="boxSettimana"></div>
</div>

<h2>3. Seleziona la sezione</h2>
<div class="sezioni-tabs" id="tabsSezioni"></div>

<div class="griglia-giorni" id="grigliaGiorni"></div>

<div id="avviso-scartate"></div>

<!-- ===== MODALE FORM ATTIVITÀ ===== -->
<div id="overlayModale">
  <div id="modaleForm">
    <h3>Dettaglio attività</h3>

    <div class="riga-doppia">
      <div class="campo-form">
        <label>Titolo</label>
        <input type="text" id="campoTitolo">
      </div>
      <div class="campo-form">
        <label>Ditta</label>
        <input type="text" id="campoDitta">
      </div>
    </div>

    <div class="campo-form">
      <label>Descrizione Attività</label>
      <textarea id="campoDescrizione"></textarea>
    </div>

    <div class="campo-form">
      <label>Btr / Linea di Tiro</label>
      <input type="text" id="campoBtr">
    </div>

    <div class="campo-form">
      <label>Squadra emergenze</label>
      <div class="scelta-radio">
        <label><input type="radio" name="squadraEmergenze" value="disposizione"> A disposizione</label>
        <label><input type="radio" name="squadraEmergenze" value="non_necessaria"> Non necessaria</label>
      </div>
    </div>

    <div class="campo-form">
      <label>Rep. Artificieri</label>
      <div class="scelta-radio">
        <label><input type="radio" name="repArtificieri" value="in_btr"> In btr</label>
        <label><input type="radio" name="repArtificieri" value="non_presente"> Non presente</label>
      </div>
    </div>

    <div class="campo-form">
      <label>Rep. Armamento</label>
      <div class="scelta-radio">
        <label><input type="radio" name="repArmamento" value="in_btr"> In btr</label>
        <label><input type="radio" name="repArmamento" value="non_presente"> Non presente</label>
      </div>
    </div>

    <div class="campo-form">
      <label>Rep. Osservatori</label>
      <div class="scelta-radio">
        <label><input type="radio" name="repOsservatori" value="in_btr"> In btr</label>
        <label><input type="radio" name="repOsservatori" value="non_presente"> Non presente</label>
      </div>
    </div>

    <div class="campo-form">
      <label>Sez. Metrobalistica</label>
      <div class="scelta-radio">
        <label><input type="radio" name="sezMetrobalistica" value="in_btr"> In btr</label>
        <label><input type="radio" name="sezMetrobalistica" value="non_presente"> Non presente</label>
      </div>
    </div>

    <div class="riga-doppia">
      <div class="campo-form">
        <label>POS</label>
        <input type="text" id="campoPos">
      </div>
      <div class="campo-form">
        <label>SIC</label>
        <input type="text" id="campoSic">
      </div>
    </div>

    <div class="campo-form">
      <label>Assetti sanitari</label>
      <div class="scelta-radio">
        <label><input type="radio" name="assettiSanitari" value="ditta"> A cura Ditta</label>
        <label><input type="radio" name="assettiSanitari" value="no"> No</label>
      </div>
    </div>

    <div class="campo-form">
      <label>Sgombero</label>
      <div class="scelta-radio">
        <label><input type="checkbox" id="sgomberoTerra"> Terra</label>
        <label><input type="checkbox" id="sgomberoMare"> Mare</label>
      </div>
      <div class="scelta-radio" style="margin-top:8px;">
        <label><input type="radio" name="sgomberoCura" value="ditta"> A cura Ditta</label>
        <label><input type="radio" name="sgomberoCura" value="no"> No</label>
      </div>
    </div>

    <div class="azioni-modale">
      <button id="btnAnnulla">Annulla</button>
      <button id="btnSalva">Salva</button>
    </div>
  </div>
</div>

<script>
// ===================== MAPPING SEZIONI =====================
const MAPPING_SEZIONI = {
  "Artiglierie Terrestri": "ARTIGLIERIE",
  "Carri e Blindo": "CARRI_BLINDO",
  "Mortai, Armi C/C e C/A": "MORTAI",
  "Impianti": "IMPIANTI",
  "CSSN NEA": "NEA"
};
const NOMI_SEZIONI = {
  "ARTIGLIERIE": "SEZIONE ARTIGLIERIE TERRESTRI",
  "CARRI_BLINDO": "SEZIONE CARRI E BLINDO",
  "MORTAI": "SEZIONE MORTAI, ARMI C/C E C/A",
  "IMPIANTI": "SEZIONE IMPIANTI",
  "NEA": "NEA"
};

let datiRaggruppati = null;   // risultato di filtraERaggruppa
let dateGiorniCorrenti = [];  // le 5 date (Lun-Ven) della settimana selezionata
let sezioneSelezionata = "ARTIGLIERIE";
let formSalvati = {};         // chiave univoca -> dati compilati dal form
let chiaveAttivitaAperta = null; // chiave dell'attività attualmente aperta nella modale

function chiaveUnivoca(sezione, giornoIndex, attivitaIndex) {
  return sezione + "_" + giornoIndex + "_" + attivitaIndex;
}

// ===================== UTILITY DATE =====================
function getMondayOfWeek(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = (day === 0) ? -6 : (1 - day);
  date.setDate(date.getDate() + diff);
  date.setHours(0, 0, 0, 0);
  return date;
}
function formatDDMM(d) {
  return String(d.getDate()).padStart(2,'0') + "/" + String(d.getMonth()+1).padStart(2,'0');
}
function formatDDMMYYYY(d) {
  return String(d.getDate()).padStart(2,'0') + "/" + String(d.getMonth()+1).padStart(2,'0') + "/" + d.getFullYear();
}
function stessoGiorno(d1, d2) {
  return d1.getFullYear()===d2.getFullYear() && d1.getMonth()===d2.getMonth() && d1.getDate()===d2.getDate();
}

// ===================== PARSING E RAGGRUPPAMENTO =====================
function parseDataDesiderata(valoreCella) {
  if (!valoreCella) return null;

  // Caso 1: è già un oggetto Date (Excel con vera data, letta con cellDates:true)
  if (valoreCella instanceof Date) {
    const d = new Date(valoreCella);
    d.setHours(0,0,0,0);
    return isNaN(d.getTime()) ? null : d;
  }

  // Caso 2: è un numero seriale Excel (data letta senza cellDates, fallback di sicurezza)
  if (typeof valoreCella === "number") {
    const d = new Date(Math.round((valoreCella - 25569) * 86400 * 1000));
    d.setHours(0,0,0,0);
    return isNaN(d.getTime()) ? null : d;
  }

  // Caso 3: è testo tipo "31/08/2026 - lunedì"
  const match = String(valoreCella).match(/(\d{2})\/(\d{2})\/(\d{4})/);
  if (!match) return null;
  const [, gg, mm, yyyy] = match;
  const d = new Date(parseInt(yyyy), parseInt(mm)-1, parseInt(gg));
  d.setHours(0,0,0,0);
  return d;
}

function filtraERaggruppa(righeExcel, dateGiorniSettimana) {
  const risultato = {};
  Object.values(MAPPING_SEZIONI).forEach(cod => { risultato[cod] = [[],[],[],[],[]]; });
  const scartate = [];

  righeExcel.forEach(riga => {
    const dataAttivita = parseDataDesiderata(riga["Data desiderata"]);
    if (!dataAttivita) { scartate.push({motivo:"data non valida", riga}); return; }

    const indiceGiorno = dateGiorniSettimana.findIndex(d => stessoGiorno(d, dataAttivita));
    if (indiceGiorno === -1) return; // fuori settimana: normale, non è un "errore", si ignora silenziosamente

    const valoreSezione = String(riga["Sezione interessata"] || "").trim();
    const codiceSezione = MAPPING_SEZIONI[valoreSezione];
    if (!codiceSezione) { scartate.push({motivo:"sezione non riconosciuta: '"+valoreSezione+"'", riga}); return; }

    risultato[codiceSezione][indiceGiorno].push(riga);
  });

  return { risultato, scartate };
}

// ===================== LETTURA FILE EXCEL =====================
let righeExcelGlobali = [];

document.getElementById('fileExcel').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array', cellDates:true});
    const foglio = wb.Sheets[wb.SheetNames[0]];
    righeExcelGlobali = XLSX.utils.sheet_to_json(foglio);
    aggiornaTutto();
  };
  reader.readAsArrayBuffer(file);
});

// ===================== SELETTORE SETTIMANA =====================
const inputData = document.getElementById('dataRiferimento');

// Default: lunedì della prossima settimana
const oggi = new Date();
const lunediProssimo = getMondayOfWeek(oggi);
lunediProssimo.setDate(lunediProssimo.getDate() + 7);
inputData.valueAsDate = lunediProssimo;

inputData.addEventListener('change', aggiornaTutto);

function calcolaGiorniSettimana() {
  const riferimento = inputData.valueAsDate || new Date();
  const lunedi = getMondayOfWeek(riferimento);
  const giorni = [];
  for (let i=0; i<5; i++) {
    const d = new Date(lunedi);
    d.setDate(d.getDate()+i);
    giorni.push(d);
  }
  return giorni;
}

function disegnaBoxSettimana() {
  const box = document.getElementById('boxSettimana');
  const nomi = ["LUN","MAR","MER","GIO","VEN"];
  const oggiReale = new Date(); oggiReale.setHours(0,0,0,0);
  box.innerHTML = "";
  dateGiorniCorrenti.forEach((d, i) => {
    const div = document.createElement('div');
    div.className = "giorno-box" + (stessoGiorno(d, oggiReale) ? " oggi" : "");
    div.textContent = nomi[i] + " " + formatDDMM(d);
    box.appendChild(div);
  });
}

// ===================== TABS SEZIONI =====================
function disegnaTabsSezioni() {
  const cont = document.getElementById('tabsSezioni');
  cont.innerHTML = "";
  Object.entries(NOMI_SEZIONI).forEach(([codice, nomeLungo]) => {
    const div = document.createElement('div');
    div.className = "sezione-tab" + (codice === sezioneSelezionata ? " attiva" : "");
    const count = datiRaggruppati ? datiRaggruppati.risultato[codice].reduce((a,g)=>a+g.length,0) : 0;
    div.textContent = nomeLungo + " (" + count + ")";
    div.onclick = function() { sezioneSelezionata = codice; aggiornaVisualizzazione(); };
    cont.appendChild(div);
  });
}

// ===================== GRIGLIA GIORNI PER SEZIONE SELEZIONATA =====================
function disegnaGrigliaGiorni() {
  const cont = document.getElementById('grigliaGiorni');
  cont.innerHTML = "";
  const nomi = ["LUNEDÌ","MARTEDÌ","MERCOLEDÌ","GIOVEDÌ","VENERDÌ"];
  const oggiReale = new Date(); oggiReale.setHours(0,0,0,0);

  const attivitaPerGiorno = datiRaggruppati ? datiRaggruppati.risultato[sezioneSelezionata] : [[],[],[],[],[]];

  dateGiorniCorrenti.forEach((d, i) => {
    const div = document.createElement('div');
    div.className = "giorno-cella" + (stessoGiorno(d, oggiReale) ? " oggi" : "");
    let html = "<h4>" + nomi[i] + " " + formatDDMM(d) + "</h4>";
    const lista = attivitaPerGiorno[i];
    if (lista.length === 0) {
      html += "<div class='nessuna'>Nessuna attività</div>";
      div.innerHTML = html;
    } else {
      div.innerHTML = html;
      lista.forEach((a, indiceAttivita) => {
        const chiave = chiaveUnivoca(sezioneSelezionata, i, indiceAttivita);
        const compilata = !!formSalvati[chiave];
        const itemDiv = document.createElement('div');
        itemDiv.className = "attivita-item" + (compilata ? " compilata" : "");
        itemDiv.innerHTML = "<b>" + (a["DITTA"]||"") + "</b>" + (compilata ? "<span class='segno-ok'>&#10003;</span>" : "") +
                             "<br>" + (a["Descrizione Attività"]||"");
        itemDiv.onclick = function() { apriModale(sezioneSelezionata, i, indiceAttivita, a); };
        div.appendChild(itemDiv);
      });
    }
    cont.appendChild(div);
  });
}

function disegnaAvvisoScartate() {
  const div = document.getElementById('avviso-scartate');
  if (!datiRaggruppati || datiRaggruppati.scartate.length === 0) { div.textContent = ""; return; }
  let testo = "Righe ignorate durante la lettura:\n";
  datiRaggruppati.scartate.forEach(s => {
    testo += "- " + s.motivo + " (Ditta: " + (s.riga["DITTA"]||"?") + ")\n";
  });
  div.textContent = testo;
}

// ===================== GESTIONE MODALE FORM =====================
function apriModale(sezione, giornoIndex, attivitaIndex, rigaExcel) {
  chiaveAttivitaAperta = chiaveUnivoca(sezione, giornoIndex, attivitaIndex);
  const overlay = document.getElementById('overlayModale');

  const salvatoPrecedente = formSalvati[chiaveAttivitaAperta];

  if (salvatoPrecedente) {
    // Ricarico i valori salvati in precedenza
    document.getElementById('campoTitolo').value = salvatoPrecedente.titolo;
    document.getElementById('campoDitta').value = salvatoPrecedente.ditta;
    document.getElementById('campoDescrizione').value = salvatoPrecedente.descrizione;
    document.getElementById('campoBtr').value = salvatoPrecedente.btr;
    impostaRadio('squadraEmergenze', salvatoPrecedente.squadraEmergenze);
    impostaRadio('repArtificieri', salvatoPrecedente.repArtificieri);
    impostaRadio('repArmamento', salvatoPrecedente.repArmamento);
    impostaRadio('repOsservatori', salvatoPrecedente.repOsservatori);
    impostaRadio('sezMetrobalistica', salvatoPrecedente.sezMetrobalistica);
    document.getElementById('campoPos').value = salvatoPrecedente.pos;
    document.getElementById('campoSic').value = salvatoPrecedente.sic;
    impostaRadio('assettiSanitari', salvatoPrecedente.assettiSanitari);
    document.getElementById('sgomberoTerra').checked = salvatoPrecedente.sgomberoTerra;
    document.getElementById('sgomberoMare').checked = salvatoPrecedente.sgomberoMare;
    impostaRadio('sgomberoCura', salvatoPrecedente.sgomberoCura);
  } else {
    // Precompilo dai dati Excel, resto vuoto/default
    document.getElementById('campoTitolo').value = rigaExcel["Tipologia"] || "";
    document.getElementById('campoDitta').value = rigaExcel["DITTA"] || "";
    document.getElementById('campoDescrizione').value = rigaExcel["Descrizione Attività"] || "";
    document.getElementById('campoBtr').value = rigaExcel["Btr/Linea di Tiro/commenti"] || "";
    impostaRadio('squadraEmergenze', null);
    impostaRadio('repArtificieri', null);
    impostaRadio('repArmamento', null);
    impostaRadio('repOsservatori', null);
    impostaRadio('sezMetrobalistica', null);
    document.getElementById('campoPos').value = "";
    document.getElementById('campoSic').value = "";
    impostaRadio('assettiSanitari', null);
    document.getElementById('sgomberoTerra').checked = false;
    document.getElementById('sgomberoMare').checked = false;
    impostaRadio('sgomberoCura', null);
  }

  overlay.classList.add('aperto');
}

function impostaRadio(nome, valore) {
  document.getElementsByName(nome).forEach(r => { r.checked = (r.value === valore); });
}
function leggiRadio(nome) {
  const scelto = Array.from(document.getElementsByName(nome)).find(r => r.checked);
  return scelto ? scelto.value : null;
}

function chiudiModale() {
  document.getElementById('overlayModale').classList.remove('aperto');
  chiaveAttivitaAperta = null;
}

document.getElementById('btnAnnulla').onclick = chiudiModale;

document.getElementById('btnSalva').onclick = function() {
  if (!chiaveAttivitaAperta) return;
  formSalvati[chiaveAttivitaAperta] = {
    titolo: document.getElementById('campoTitolo').value,
    ditta: document.getElementById('campoDitta').value,
    descrizione: document.getElementById('campoDescrizione').value,
    btr: document.getElementById('campoBtr').value,
    squadraEmergenze: leggiRadio('squadraEmergenze'),
    repArtificieri: leggiRadio('repArtificieri'),
    repArmamento: leggiRadio('repArmamento'),
    repOsservatori: leggiRadio('repOsservatori'),
    sezMetrobalistica: leggiRadio('sezMetrobalistica'),
    pos: document.getElementById('campoPos').value,
    sic: document.getElementById('campoSic').value,
    assettiSanitari: leggiRadio('assettiSanitari'),
    sgomberoTerra: document.getElementById('sgomberoTerra').checked,
    sgomberoMare: document.getElementById('sgomberoMare').checked,
    sgomberoCura: leggiRadio('sgomberoCura')
  };
  chiudiModale();
  disegnaGrigliaGiorni(); // per aggiornare il segno "compilata"
};

// ===================== AGGIORNAMENTO GENERALE =====================
function aggiornaTutto() {
  dateGiorniCorrenti = calcolaGiorniSettimana();
  if (righeExcelGlobali.length > 0) {
    datiRaggruppati = filtraERaggruppa(righeExcelGlobali, dateGiorniCorrenti);
  }
  disegnaBoxSettimana();
  aggiornaVisualizzazione();
}

function aggiornaVisualizzazione() {
  disegnaTabsSezioni();
  disegnaGrigliaGiorni();
  disegnaAvvisoScartate();
}

// Inizializzazione all'avvio pagina
dateGiorniCorrenti = calcolaGiorniSettimana();
disegnaBoxSettimana();
disegnaTabsSezioni();
disegnaGrigliaGiorni();
</script>

</body>
</html>
