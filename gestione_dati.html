<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Generatore Programma Settimanale</title>
<script src="xlsx.full.min.js"></script>
<script src="docx.umd.js"></script>
<style>
  :root {
    --bg: #f2f4f3;
    --panel: #ffffff;
    --ink: #1c2530;
    --ink-soft: #5c6773;
    --line: #dde1e3;
    --navy: #1f3346;
    --steel: #3e6680;
    --steel-soft: #eaf0f4;
    --amber: #c98a3b;
    --amber-soft: #fbf2e4;
    --green: #3f7d4f;
    --green-soft: #eef7f0;
    --red: #a8402f;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    padding-bottom: 60px;
  }

  header.app-bar {
    background: var(--navy);
    color: #fff;
    padding: 22px 32px;
    margin-bottom: 28px;
  }
  header.app-bar h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: 0.2px; }
  header.app-bar p { margin: 4px 0 0; font-size: 13px; color: #b7c3cd; }

  main { max-width: 960px; margin: 0 auto; padding: 0 32px; }

  .step {
    display: flex;
    gap: 16px;
    margin-bottom: 22px;
  }
  .step-num {
    flex: none;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--steel);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    margin-top: 2px;
  }
  .step-body { flex: 1; min-width: 0; }
  .step-title { font-size: 15px; font-weight: 600; margin-bottom: 10px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px 18px;
  }

  input[type="file"], input[type="date"] {
    font-size: 13px;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
  }
  label { color: var(--ink-soft); font-size: 13px; }

  .settimana-nav { display: flex; align-items: center; gap: 8px; }
  .nav-freccia {
    width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--line);
    background: #fff; color: var(--steel); font-size: 16px; cursor: pointer; line-height: 1;
  }
  .nav-freccia:hover { background: var(--steel-soft); border-color: var(--steel); }
  .settimana-range {
    flex: 1; text-align: center; font-size: 14px; font-weight: 600; color: var(--ink);
  }
  .nav-calendario {
    width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--line);
    background: #fff; font-size: 13px; cursor: pointer;
  }
  .nav-calendario:hover { background: var(--steel-soft); border-color: var(--steel); }

  .settimana-giorni { display: flex; gap: 6px; margin-top: 10px; }
  .giorno-box {
    flex: 1; text-align: center; padding: 5px 4px;
    border: 1px solid var(--line); border-left: 3px solid var(--line);
    border-radius: 5px; background: #fafbfb; font-size: 11.5px; color: var(--ink-soft);
  }
  .giorno-box.oggi {
    background: var(--amber-soft); border-left: 3px solid var(--amber);
    color: var(--ink); font-weight: 600;
  }
  .sezioni-tabs { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .sezione-tab {
    padding: 7px 14px; border: 1px solid var(--line); border-radius: 999px;
    cursor: pointer; background: #fff; font-size: 13px; color: var(--ink-soft);
    transition: background 0.12s, color 0.12s, border-color 0.12s;
  }
  .sezione-tab:hover { border-color: var(--steel); color: var(--steel); }
  .sezione-tab.attiva { background: var(--steel); color: white; border-color: var(--steel); }
  .sezione-tab.completa { box-shadow: inset 0 -3px 0 var(--green); }
  .sezione-tab.completa.attiva { background: var(--green); border-color: var(--green); box-shadow: none; }

  .griglia-giorni { display: flex; gap: 10px; margin-top: 18px; }
  .giorno-cella {
    flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px;
    padding: 10px; min-height: 90px; background: var(--panel);
  }
  .giorno-cella.oggi { background: var(--amber-soft); border-color: #e9d3ac; }
  .giorno-cella h4 {
    margin: 0 0 8px 0; font-size: 12px; font-weight: 600; color: var(--ink-soft);
    text-transform: none; letter-spacing: 0.2px;
  }
  .sottosezione-titolo {
    font-size: 11px; font-weight: 700; color: var(--steel); text-transform: uppercase;
    letter-spacing: 0.3px; margin: 10px 0 4px; padding-top: 6px; border-top: 1px dashed var(--line);
  }
  .sottosezione-titolo:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
  .attivita-item {
    font-size: 12.5px; background: #fff; border: 1px solid var(--line);
    border-left: 3px solid var(--steel); border-radius: 5px;
    padding: 7px 8px; margin-bottom: 6px;
    transition: background 0.12s, border-color 0.12s;
    cursor: grab;
  }
  .attivita-item.in-trascinamento { opacity: 0.4; }
  .attivita-item.drop-prima { box-shadow: inset 0 3px 0 var(--steel); }
  .attivita-item.drop-dopo { box-shadow: inset 0 -3px 0 var(--steel); }
  .lista-attivita-sezione { min-height: 20px; border-radius: 6px; transition: background 0.12s; }
  .lista-attivita-sezione.drag-over { background: var(--steel-soft); outline: 2px dashed var(--steel); outline-offset: 2px; }
  .attivita-item:hover { background: var(--steel-soft); }
  .attivita-item.compilata { border-left: 3px solid var(--green); background: var(--green-soft); }
  .attivita-item b { color: var(--ink); }
  .attivita-item .segno-ok { color: var(--green); font-weight: bold; }
  .attivita-item .testo-anteprima { cursor: pointer; }
  .attivita-item .riga-controlli {
    display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 6px;
  }
  .attivita-item .elimina-attivita {
    font-size: 11px; color: var(--red); background: none; border: none; cursor: pointer; padding: 2px 6px;
  }
  .attivita-item .elimina-attivita:hover { text-decoration: underline; }
  .aggiungi-attivita {
    font-size: 11.5px; color: var(--steel); background: none; border: 1px dashed var(--line);
    border-radius: 5px; padding: 5px 8px; cursor: pointer; width: 100%; margin-top: 2px; margin-bottom: 10px;
  }
  .aggiungi-attivita:hover { border-color: var(--steel); background: var(--steel-soft); }
  .nessuna { font-size: 12px; color: #9aa3ab; font-style: italic; }

  #avviso-scartate {
    color: var(--red); font-size: 13px; margin-top: 16px; white-space: pre-wrap;
    background: #fdf1ef; border: 1px solid #f0d3cd; border-radius: 6px; padding: 10px 12px;
  }
  #avviso-scartate:empty { display: none; padding: 0; border: none; }

  /* ===== MODALE FORM ATTIVITÀ ===== */
  #overlayModale {
    display: none; position: fixed; top:0; left:0; width:100%; height:100%;
    background: rgba(20,28,36,0.55); z-index: 1000; align-items: center; justify-content: center;
  }
  #overlayModale.aperto { display: flex; }
  #modaleForm {
    background: var(--panel); border-radius: 10px; padding: 26px 28px; width: 560px;
    max-height: 85vh; overflow-y: auto; box-shadow: 0 12px 40px rgba(0,0,0,0.25);
  }
  #modaleForm h3 {
    margin: 0 0 18px; font-size: 16px; font-weight: 600; color: var(--navy);
    padding-bottom: 12px; border-bottom: 1px solid var(--line);
  }
  .campo-form { margin-bottom: 14px; }
  .campo-form label { display:block; font-weight: 600; font-size: 12.5px; margin-bottom: 5px; color: var(--ink-soft); }
  .campo-form input[type=text], .campo-form select, .campo-form textarea {
    width: 100%; box-sizing: border-box; padding: 7px 9px; font-size: 13px;
    border: 1px solid var(--line); border-radius: 5px; color: var(--ink); background: #fff;
    font-family: inherit;
  }
  .campo-form input[type=text]:focus, .campo-form select:focus, .campo-form textarea:focus {
    outline: none; border-color: var(--steel); box-shadow: 0 0 0 3px var(--steel-soft);
  }
  .campo-form textarea { min-height: 60px; resize: vertical; }
  .scelta-radio { display: flex; gap: 16px; font-size: 13px; flex-wrap: wrap; }
  .scelta-radio label { font-weight: normal; display:flex; align-items:center; gap:5px; color: var(--ink); }
  .scelta-singola { font-weight: normal !important; display:flex; align-items:center; gap:6px; color: var(--ink); font-size: 13px; cursor: pointer; }
  .riga-doppia { display:flex; gap: 15px; }
  .riga-doppia .campo-form { flex:1; }
  .riga-doppia select { flex: 1; }
  .riga-btr-vs { display: flex; align-items: center; gap: 8px; }
  .riga-btr-vs select { flex: 1; }
  .testo-vs { font-size: 12px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; }
  .riga-sgombero { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .riga-sgombero-destra { display: flex; gap: 16px; font-size: 13px; }
  .riga-sgombero-destra label { font-weight: normal; display:flex; align-items:center; gap:5px; color: var(--ink); }
  .azioni-modale {
    display:flex; justify-content: flex-end; gap: 10px; margin-top: 22px;
    padding-top: 16px; border-top: 1px solid var(--line);
  }
  .azioni-modale button {
    padding: 8px 18px; border-radius: 6px; border: 1px solid transparent; cursor: pointer;
    font-size: 13px; font-weight: 500; font-family: inherit;
  }
  #btnSalva { background: var(--steel); color: white; }
  #btnSalva:hover { background: var(--navy); }
  #btnAnnulla { background: #fff; color: var(--ink-soft); border-color: var(--line); }
  #btnAnnulla:hover { background: #f4f5f5; }

  #btnGenera, #btnGeneraSezione {
    padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer;
    font-size: 14px; font-weight: 600; font-family: inherit;
    background: var(--steel); color: white; margin-right: 10px;
  }
  #btnGenera:hover, #btnGeneraSezione:hover { background: var(--navy); }
  #btnGeneraSezione { background: #fff; color: var(--steel); border: 1px solid var(--steel); }
  #btnGeneraSezione:hover { background: var(--steel-soft); }
  #avvisoNonCompilate {
    margin-top: 14px; font-size: 13px; color: #8a6116; white-space: pre-wrap;
    background: var(--amber-soft); border: 1px solid #e9d3ac; border-radius: 6px; padding: 10px 12px;
  }
  #avvisoNonCompilate:empty { display: none; padding: 0; border: none; margin-top: 0; }
</style>
</head>
<body>

<script>
// ===================== MAPPING SEZIONI =====================
const MAPPING_SEZIONI = {
  "Artiglierie Terrestri": "ARTIGLIERIE",
  "Carri e Blindo": "CARRI_BLINDO",
  "Mortai, Armi C/C e C/A": "MORTAI",
  "Impianti": "IMPIANTI",
  "CSSN NEA": "NEA"
};
const NOMI_SEZIONI = {
  "ARTIGLIERIE": "SEZIONE ARTIGLIERIE TERRESTRI",
  "CARRI_BLINDO": "SEZIONE CARRI E BLINDO",
  "MORTAI": "SEZIONE MORTAI, ARMI C/C E C/A",
  "IMPIANTI": "SEZIONE IMPIANTI",
  "NEA": "NEA"
};

let datiRaggruppati = null;   // risultato di filtraERaggruppa (usato solo per contatori/scartate)
let dateGiorniCorrenti = [];  // le 5 date (Lun-Ven) della settimana selezionata
let sezioniSelezionate = new Set(["ARTIGLIERIE"]); // sezioni visibili nella griglia (multi-selezione)
let registroAttivita = [];    // elenco vivo delle attività (spostabili/eliminabili/aggiungibili), fonte di verità per vista e generazione
let prossimoIdAttivita = 1;
let recordAperto = null;      // record esistente attualmente in modifica nella modale (null se si sta aggiungendo una nuova attività)
let nuovoTarget = null;       // {sezione, giorno} quando si sta aggiungendo una nuova attività (non ancora salvata)

function nuovoId() {
  return "act" + (prossimoIdAttivita++);
}

// Ricostruisce il registro attività a partire dal raggruppamento Excel (chiamato solo quando si ricarica l'Excel o si cambia settimana)
function costruisciRegistro(risultato) {
  const nuovo = [];
  Object.keys(risultato).forEach(codiceSezione => {
    risultato[codiceSezione].forEach((righeGiorno, giornoIndex) => {
      righeGiorno.forEach(rigaExcel => {
        nuovo.push({ id: nuovoId(), sezione: codiceSezione, giorno: giornoIndex, rigaExcel, formData: null });
      });
    });
  });
  return nuovo;
}

// ===================== UTILITY DATE =====================
function getMondayOfWeek(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = (day === 0) ? -6 : (1 - day);
  date.setDate(date.getDate() + diff);
  date.setHours(0, 0, 0, 0);
  return date;
}
function formatDDMM(d) {
  return String(d.getDate()).padStart(2,'0') + "/" + String(d.getMonth()+1).padStart(2,'0');
}
function formatDDMMYYYY(d) {
  return String(d.getDate()).padStart(2,'0') + "/" + String(d.getMonth()+1).padStart(2,'0') + "/" + d.getFullYear();
}
function stessoGiorno(d1, d2) {
  return d1.getFullYear()===d2.getFullYear() && d1.getMonth()===d2.getMonth() && d1.getDate()===d2.getDate();
}

// ===================== PARSING E RAGGRUPPAMENTO =====================
function parseDataDesiderata(valoreCella) {
  if (!valoreCella) return null;

  // Caso 1: è già un oggetto Date (Excel con vera data, letta con cellDates:true)
  if (valoreCella instanceof Date) {
    const d = new Date(valoreCella);
    d.setHours(0,0,0,0);
    return isNaN(d.getTime()) ? null : d;
  }

  // Caso 2: è un numero seriale Excel (data letta senza cellDates, fallback di sicurezza)
  if (typeof valoreCella === "number") {
    const d = new Date(Math.round((valoreCella - 25569) * 86400 * 1000));
    d.setHours(0,0,0,0);
    return isNaN(d.getTime()) ? null : d;
  }

  // Caso 3: è testo tipo "31/08/2026 - lunedì"
  const match = String(valoreCella).match(/(\d{2})\/(\d{2})\/(\d{4})/);
  if (!match) return null;
  const [, gg, mm, yyyy] = match;
  const d = new Date(parseInt(yyyy), parseInt(mm)-1, parseInt(gg));
  d.setHours(0,0,0,0);
  return d;
}

function filtraERaggruppa(righeExcel, dateGiorniSettimana) {
  const risultato = {};
  Object.values(MAPPING_SEZIONI).forEach(cod => { risultato[cod] = [[],[],[],[],[]]; });
  const scartate = [];

  righeExcel.forEach(riga => {
    const dataAttivita = parseDataDesiderata(riga["Data desiderata"]);
    if (!dataAttivita) { scartate.push({motivo:"data non valida", riga}); return; }

    const indiceGiorno = dateGiorniSettimana.findIndex(d => stessoGiorno(d, dataAttivita));
    if (indiceGiorno === -1) return; // fuori settimana: normale, non è un "errore", si ignora silenziosamente

    const valoreSezione = String(riga["Sezione interessata"] || "").trim();
    const codiceSezione = MAPPING_SEZIONI[valoreSezione];
    if (!codiceSezione) { scartate.push({motivo:"sezione non riconosciuta: '"+valoreSezione+"'", riga}); return; }

    risultato[codiceSezione][indiceGiorno].push(riga);
  });

  return { risultato, scartate };
}

// ===================== LETTURA FILE EXCEL =====================
let righeExcelGlobali = [];

document.getElementById('fileExcel').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {

function calcolaGiorniSettimana() {
  const riferimento = inputData.valueAsDate || new Date();
  const lunedi = getMondayOfWeek(riferimento);
  const giorni = [];
  for (let i=0; i<5; i++) {
    const d = new Date(lunedi);
    d.setDate(d.getDate()+i);
    giorni.push(d);
  }
  return giorni;
}

const MESI_ITALIANI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];

function formatRangeSettimana(lunedi, venerdi) {
  const gg1 = lunedi.getDate(), gg2 = venerdi.getDate();
  const m1 = lunedi.getMonth(), m2 = venerdi.getMonth();
  const a1 = lunedi.getFullYear(), a2 = venerdi.getFullYear();
  if (a1 !== a2) return gg1 + " " + MESI_ITALIANI[m1] + " " + a1 + " – " + gg2 + " " + MESI_ITALIANI[m2] + " " + a2;
  if (m1 !== m2) return gg1 + " " + MESI_ITALIANI[m1] + " – " + gg2 + " " + MESI_ITALIANI[m2] + " " + a1;
  return gg1 + " – " + gg2 + " " + MESI_ITALIANI[m1] + " " + a1;
}

function anteprimaAttivita(record) {
  if (record.formData) {
    return { ditta: record.formData.ditta || "(senza ditta)", testo: record.formData.titolo || record.formData.descrizione || "" };
  }
  const r = record.rigaExcel || {};
  return { ditta: r["DITTA"] || "(nuova attività)", testo: r["Descrizione Attività"] || "" };
}

function disegnaGrigliaGiorni() {
  const cont = document.getElementById('grigliaGiorni');
  cont.innerHTML = "";
  const nomi = ["LUNEDÌ","MARTEDÌ","MERCOLEDÌ","GIOVEDÌ","VENERDÌ"];
  const oggiReale = new Date(); oggiReale.setHours(0,0,0,0);
  const sezioniDaMostrare = Object.keys(NOMI_SEZIONI).filter(cod => sezioniSelezionate.has(cod));

  dateGiorniCorrenti.forEach((d, giornoIndex) => {
    const div = document.createElement('div');
    div.className = "giorno-cella" + (stessoGiorno(d, oggiReale) ? " oggi" : "");
    const titolo = document.createElement('h4');
    titolo.textContent = nomi[giornoIndex] + " " + formatDDMM(d);
    div.appendChild(titolo);

    if (sezioniDaMostrare.length === 0) {
      const p = document.createElement('div');
      p.className = "nessuna";
      p.textContent = "Seleziona almeno una sezione";
      div.appendChild(p);
    }

    sezioniDaMostrare.forEach(codiceSezione => {
      if (sezioniDaMostrare.length > 1) {
        const sotto = document.createElement('div');
        sotto.className = "sottosezione-titolo";
        sotto.textContent = NOMI_SEZIONI[codiceSezione];
        div.appendChild(sotto);
      }

      // Contenitore/zona di rilascio per questa combinazione sezione+giorno
      const lista = document.createElement('div');
      lista.className = "lista-attivita-sezione";
      lista.dataset.sezione = codiceSezione;
      lista.dataset.giorno = giornoIndex;

      lista.ondragover = function(e) {
        e.preventDefault();
        lista.classList.add('drag-over');
      };
      lista.ondragleave = function() {
        lista.classList.remove('drag-over');
      };
      lista.ondrop = function(e) {
        e.preventDefault();
        lista.classList.remove('drag-over');
        const idTrascinato = e.dataTransfer.getData('text/plain');
        const sorgente = registroAttivita.find(r => r.id === idTrascinato);
        if (!sorgente || sorgente.sezione !== codiceSezione) return;
        // Rilascio su spazio vuoto della lista (non su una attività specifica) -> la sposto in fondo a questo giorno
        registroAttivita = registroAttivita.filter(r => r.id !== sorgente.id);
        sorgente.giorno = giornoIndex;
        registroAttivita.push(sorgente);
        aggiornaVisualizzazione();
      };

      const recordGiorno = registroAttivita.filter(r => r.sezione === codiceSezione && r.giorno === giornoIndex);

      if (recordGiorno.length === 0) {
        const p = document.createElement('div');
        p.className = "nessuna";
        p.textContent = "Nessuna attività";
        lista.appendChild(p);
      }

      recordGiorno.forEach(record => {
        const compilata = !!record.formData;
        const { ditta, testo } = anteprimaAttivita(record);

        const itemDiv = document.createElement('div');
        itemDiv.className = "attivita-item" + (compilata ? " compilata" : "");
        itemDiv.draggable = true;
        itemDiv.ondragstart = function(e) {
          e.dataTransfer.setData('text/plain', record.id);
          e.dataTransfer.effectAllowed = 'move';
          itemDiv.classList.add('in-trascinamento');
        };
        itemDiv.ondragend = function() {
          itemDiv.classList.remove('in-trascinamento');
        };
        itemDiv.ondragover = function(e) {
          e.preventDefault();
          e.stopPropagation(); // evita che si attivi anche l'evidenziazione del contenitore
          const rect = itemDiv.getBoundingClientRect();
          const sopra = (e.clientY - rect.top) < rect.height / 2;
          itemDiv.classList.toggle('drop-prima', sopra);
          itemDiv.classList.toggle('drop-dopo', !sopra);
        };
        itemDiv.ondragleave = function() {
          itemDiv.classList.remove('drop-prima', 'drop-dopo');
        };
        itemDiv.ondrop = function(e) {
          e.preventDefault();
          e.stopPropagation();
          const sopra = itemDiv.classList.contains('drop-prima');
          itemDiv.classList.remove('drop-prima', 'drop-dopo');

          const idTrascinato = e.dataTransfer.getData('text/plain');
          if (idTrascinato === record.id) return; // rilasciata su se stessa
          const sorgente = registroAttivita.find(r => r.id === idTrascinato);
          if (!sorgente || sorgente.sezione !== record.sezione) return;

          registroAttivita = registroAttivita.filter(r => r.id !== sorgente.id);
          sorgente.giorno = record.giorno; // adotta il giorno del bersaglio (utile se veniva da un altro giorno)
          const idxBersaglio = registroAttivita.findIndex(r => r.id === record.id);
          registroAttivita.splice(sopra ? idxBersaglio : idxBersaglio + 1, 0, sorgente);
          aggiornaVisualizzazione();
        };

        const testoDiv = document.createElement('div');
        testoDiv.className = "testo-anteprima";
        testoDiv.innerHTML = "<b>" + ditta + "</b>" + (compilata ? " <span class='segno-ok'>&#10003;</span>" : "") + "<br>" + testo;
        testoDiv.onclick = function() { apriModaleEsistente(record); };
        itemDiv.appendChild(testoDiv);

        const controlli = document.createElement('div');
        controlli.className = "riga-controlli";

        const btnElimina = document.createElement('button');
        btnElimina.className = "elimina-attivita";
        btnElimina.textContent = "Elimina";
        btnElimina.onclick = function(e) {
          e.stopPropagation();
          if (confirm("Eliminare questa attività dal programma?")) {
            registroAttivita = registroAttivita.filter(r => r.id !== record.id);
            aggiornaVisualizzazione();
          }
        };

        controlli.appendChild(btnElimina);
        itemDiv.appendChild(controlli);

        lista.appendChild(itemDiv);
      });

      div.appendChild(lista);

      const btnAggiungi = document.createElement('button');
      btnAggiungi.className = "aggiungi-attivita";
      btnAggiungi.textContent = "+ Aggiungi attività";
      btnAggiungi.onclick = function() { apriModaleNuovo(codiceSezione, giornoIndex); };
      div.appendChild(btnAggiungi);
    });

    cont.appendChild(div);
  });
}

const DITTE_FISSE = ["Leonardo s.p.a.", "KNDS Ammo Italy S.p.A.", "ELT", "MES", "Rheinmetall Italia S.p.A:"];

function normalizzaSpazi(testo) {
  return String(testo || "").replace(/\s+/g, ' ').trim();
}

function impostaDitta(valoreDitta) {
  const valoreNormalizzato = normalizzaSpazi(valoreDitta);
  const corrispondenza = DITTE_FISSE.find(d => normalizzaSpazi(d) === valoreNormalizzato);
  const select = document.getElementById('campoDittaSelect');
  const inputAltro = document.getElementById('campoDittaAltro');
  if (corrispondenza) {
    select.value = corrispondenza;
    inputAltro.style.display = "none";
    inputAltro.value = "";
  } else {
    select.value = "altro";
    inputAltro.style.display = "block";
    inputAltro.value = valoreDitta || "";
  }
}

function leggiDitta() {
  const select = document.getElementById('campoDittaSelect');
  if (select.value === "altro") {
    return document.getElementById('campoDittaAltro').value;
  }
  return select.value;
}

document.getElementById('campoDittaSelect').addEventListener('change', function() {
  document.getElementById('campoDittaAltro').style.display = (this.value === "altro") ? "block" : "none";

const ETICHETTE_REP = {

  repArmamento: "Rep. Armamento",
  repOsservatori: "Rep. Osservatori",
  sezMetrobalistica: "Sez. Metrobalistica"
};
const DIM_TESTO_CELLA = 13; // 6.5pt
const FONT_CELLA = "Times New Roman";

function runCella(testo, opts) {
  opts = opts || {};
  return new TextRun({
    text: testo, bold: !!opts.bold, underline: opts.underline ? {} : undefined,
    size: DIM_TESTO_CELLA, font: FONT_CELLA
  });
}
function terminaFrase(testo) {
  return testo.endsWith(".") ? testo : testo + ".";
}

function componiAttivita(dati) {
  const paragrafi = [];

  paragrafi.push(new Paragraph({
    children: [ runCella(`${dati.tipologia} ${dati.ditta} – ${dati.titolo}`.trim(), { bold: true }) ]
  }));

  let contenutoRiga2 = [];
  function aggiungiSegmento(nuoviRuns) {
    if (contenutoRiga2.length > 0) contenutoRiga2.push(runCella(" "));
    contenutoRiga2 = contenutoRiga2.concat(nuoviRuns);
  }
  if (dati.descrizione && dati.descrizione.trim()) {
    aggiungiSegmento([ runCella(dati.descrizione.trim()) ]);
  }
  if (dati.squadraEmergenze === true) {
    aggiungiSegmento([ runCella("Squadra emergenze:", { underline: true }), runCella(" a disposizione.") ]);
  }
  Object.keys(ETICHETTE_REP).filter(k => dati[k] === true).forEach(k => {
    aggiungiSegmento([ runCella(ETICHETTE_REP[k] + ":", { underline: true }), runCella(" in btr.") ]);
  });
  if (contenutoRiga2.length > 0) {
    paragrafi.push(new Paragraph({ children: contenutoRiga2 }));
  }

  if ((dati.pos && dati.pos.trim()) || (dati.sic && dati.sic.trim())) {
    let testo = "";
    if (dati.pos && dati.pos.trim()) testo += "POS = " + dati.pos.trim();
    if (dati.sic && dati.sic.trim()) testo += (testo ? " - " : "") + "SIC = " + dati.sic.trim();
    paragrafi.push(new Paragraph({ children: [ runCella(testo, { bold: true }) ] }));
  }

  const btr1 = (dati.btr1 || "").trim();
  const btr2 = (dati.btr2 || "").trim();
  const testoBtr = (btr1 && btr2) ? (btr1 + " vs " + btr2) : (btr1 || btr2);
  if (testoBtr) {
    paragrafi.push(new Paragraph({ children: [ runCella("Btr " + testoBtr, { bold: true }) ] }));
  }

  const sanitariPresente = dati.assettiSanitari === true;
  const sgomberoPresente = dati.sgomberoTerra || dati.sgomberoMare;
  const sgomberoCuraDitta = dati.sgomberoCura === true;
  const doveSgombero = (dati.sgomberoTerra && dati.sgomberoMare) ? "a terra e mare" : (dati.sgomberoTerra ? "a terra" : "a mare");

  const righeAssetti = [];
  if (sanitariPresente && sgomberoPresente && sgomberoCuraDitta) {
    righeAssetti.push(terminaFrase("Assetti per assistenza sanitaria e sgombero " + doveSgombero + " a cura " + dati.ditta));
  } else {
    if (sanitariPresente) righeAssetti.push(terminaFrase("Assetti per assistenza sanitaria a cura " + dati.ditta));
    if (sgomberoPresente) {
      let riga = "Sgombero " + doveSgombero;
      if (sgomberoCuraDitta) riga += " a cura " + dati.ditta;
      righeAssetti.push(terminaFrase(riga));
    }
  }
  if (righeAssetti.length > 0) {
    paragrafi.push(new Paragraph({ children: [] }));
    righeAssetti.forEach(r => paragrafi.push(new Paragraph({ children: [ runCella(r, { bold: true }) ] })));
  }

  return paragrafi;
}

function componiCella(listaAttivita) {
  if (!listaAttivita || listaAttivita.length === 0) {
    return [ new Paragraph({ children: [] }) ];
  }
  let paragrafi = [];
  listaAttivita.forEach((attivita, idx) => {
    if (idx > 0) paragrafi.push(new Paragraph({ children: [] }));
    paragrafi = paragrafi.concat(componiAttivita(attivita));
  });
  return paragrafi;
}

// ===================== RACCOLTA DATI PER OGNI CELLA (dal registro attività) =====================
function recordsPerCella(codiceSezione, giornoIndex) {
  if (!codiceSezione) return [];
  return registroAttivita.filter(r => r.sezione === codiceSezione && r.giorno === giornoIndex);
}

function datiEffettivi(record, elencoNonCompilate) {
  if (record.formData) return record.formData;

  // Fallback: attività mai aperta/compilata nel form, uso una bozza minima (da Excel se disponibile)
  const rigaExcel = record.rigaExcel || {};
  const nomiGiorni = ["LUN","MAR","MER","GIO","VEN"];
  elencoNonCompilate.push((rigaExcel["DITTA"] || "(nuova attività)") + " — " + NOMI_SEZIONI[record.sezione] + " (" + nomiGiorni[record.giorno] + ")");
  const tipologiaExcel = normalizzaSpazi(rigaExcel["Tipologia"]).toUpperCase();
  const btrRilevate = rilevaBtr(rigaExcel["Btr/Linea di Tiro/commenti"]);
  return {
    tipologia: (tipologiaExcel === "AD") ? "AD" : "CT",
    ditta: rigaExcel["DITTA"] || "",
    titolo: rigaExcel["Descrizione Attività"] || "",
    descrizione: "",
    btr1: btrRilevate.btr1, btr2: btrRilevate.btr2,
    squadraEmergenze: false, repArtificieri: false, repArmamento: false, repOsservatori: false, sezMetrobalistica: false,
    pos: "", sic: "", assettiSanitari: false, sgomberoTerra: false, sgomberoMare: false, sgomberoCura: false
  };
}

// ===================== ASSEMBLAGGIO DOCUMENTO =====================
// modalitaCompleta=true -> tutte le sezioni; false -> solo codiceSezioneSingola (le altre righe vengono rimosse dalla tabella)
function generaDocumento(modalitaCompleta, codiceSezioneSingola) {
  if (registroAttivita.length === 0 && (!righeExcelGlobali || righeExcelGlobali.length === 0)) {
    alert("Carica prima il file Excel (passaggio 1).");
    return;
  }

  const elencoNonCompilate = [];
  const righeDaUsare = modalitaCompleta ? RIGHE_TABELLA : RIGHE_TABELLA.filter(r => r.codice === codiceSezioneSingola);

  const giorniNomi = ["LUNEDÌ", "MARTEDÌ", "MERCOLEDÌ", "GIOVEDÌ", "VENERDÌ"];
  const rigaIntestazione = new TableRow({
    height: altezzaRiga(309),
    children: [
      cellaLabel("", 2, undefined, LARGHEZZA_LABEL),
      ...giorniNomi.map((nome, i) => cellaGiorno(nome, formatDDMM(dateGiorniCorrenti[i]), LARGHEZZE_GIORNI[i]))
    ]
  });

  const righeTabellaFinale = righeDaUsare.map(riga =>
    new TableRow({
      height: altezzaRiga(riga.altezza),
      children: [
        cellaLabel(riga.nome, 2, undefined, LARGHEZZA_LABEL),
        ...LARGHEZZE_GIORNI.map((larghezza, giornoIndex) => {
          const lista = recordsPerCella(riga.codice, giornoIndex).map(r => datiEffettivi(r, elencoNonCompilate));
          return cellaDato(larghezza, componiCella(lista));
        })
      ]
    })
  );

  // Righe "ENTI ESTERNI" (Sede/Valmontorio): sempre vuote (non gestite da Excel per ora), solo nella versione completa
  const righeEntiEsterni = [];
  if (modalitaCompleta) {
    righeEntiEsterni.push(
      new TableRow({
        height: altezzaRiga(392),
        children: [
          cellaLabel("ENTI ESTERNI", 1, "restart", LARGHEZZE_COLONNE[0]),
          cellaLabel("Sede", 1, undefined, LARGHEZZE_COLONNE[1]),
          ...LARGHEZZE_GIORNI.map(l => cellaDato(l))
        ]
      }),
      new TableRow({
        height: altezzaRiga(392),
        children: [
          cellaLabel("", 1, "continue", LARGHEZZE_COLONNE[0]),
          cellaLabel("Valmontorio", 1, undefined, LARGHEZZE_COLONNE[1]),
          ...LARGHEZZE_GIORNI.map(l => cellaDato(l))
        ]
      })
    );
  }

  const tabella = new Table({
    width: { size: LARGHEZZE_COLONNE.reduce((a,b) => a+b, 0), type: WidthType.DXA },
    columnWidths: LARGHEZZE_COLONNE,
    indent: { size: -289, type: WidthType.DXA },
    rows: [rigaIntestazione, ...righeTabellaFinale, ...righeEntiEsterni]
  });

  const suffissoSezione = modalitaCompleta ? "" : " – " + NOMI_SEZIONI[codiceSezioneSingola];

  const spazioIniziale = new Paragraph({ text: "" });
  const titolo = new Paragraph({
    alignment: AlignmentType.CENTER,
    children: [ new TextRun({ text: "UFFICIO TECNICO TERRITORIALE ARMAMENTI TERRESTRI - NETTUNO", bold: true, size: 20, font: "Times New Roman" }) ]
  });
  const sottotitolo = new Paragraph({
    alignment: AlignmentType.CENTER,
    spacing: { after: 200 },
    children: [ new TextRun({
      text: "PROGRAMMA SETTIMANALE DEI TIRI E LAVORI DAL " + formatDDMMYYYY(dateGiorniCorrenti[0]) + " AL " + formatDDMMYYYY(dateGiorniCorrenti[4]) + suffissoSezione,
      bold: true, size: 20, font: "Times New Roman"
    }) ]
  });
  const spazioDopoTabella = new Paragraph({ text: "", spacing: { before: 200 } });
  const rigaFirmeTitoli = new Paragraph({
    tabStops: [{ type: TabStopType.CENTER, position: 2694 }, { type: TabStopType.CENTER, position: 8080 }],
    children: [ new TextRun({ text: "\tIL CAPO SERVIZIO SUPPORTO TECNICO POLIGONO\tIL CAPO SERVIZIO POLIGONO", size: 16, font: "Times New Roman" }) ]
  });
  const rigaFirmeNomi = new Paragraph({
    tabStops: [{ type: TabStopType.CENTER, position: 2694 }, { type: TabStopType.CENTER, position: 8080 }],
    children: [ new TextRun({ text: "\tTen. Col. g. (gua) Francesco IODICE\tMagg. ing. Andrea DI MARIO", size: 16, font: "Times New Roman" }) ]
  });
  const spazioVisto = new Paragraph({ text: "", spacing: { before: 300 } });
  const rigaVisto = new Paragraph({ alignment: AlignmentType.CENTER, children: [ new TextRun({ text: "VISTO, si approva:", size: 16, font: "Times New Roman" }) ] });
  const rigaViceDirettore = new Paragraph({ alignment: AlignmentType.CENTER, children: [ new TextRun({ text: "IL VICE DIRETTORE", size: 16, font: "Times New Roman" }) ] });
  const rigaNomeVice = new Paragraph({ alignment: AlignmentType.CENTER, children: [ new TextRun({ text: "Ten. Col. ing. Francesco RUTIGLIANO", size: 16, font: "Times New Roman" }) ] });

  const doc = new Document({
    sections: [{
      properties: {
        page: {
          size: { width: 11906, height: 16838, orientation: PageOrientation.PORTRAIT },
          margin: { top: 180, bottom: 180, left: 567, right: 566 }
        }
      },
      children: [ spazioIniziale, titolo, sottotitolo, tabella, spazioDopoTabella, rigaFirmeTitoli, rigaFirmeNomi, spazioVisto, rigaVisto, rigaViceDirettore, rigaNomeVice ]
    }]
  });

  Packer.toBlob(doc).then(function(blob) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const suffissoFile = modalitaCompleta ? "" : "_" + codiceSezioneSingola;
    a.download = "Settimanale_dal_" + formatDDMMYYYY(dateGiorniCorrenti[0]).replace(/\//g,"-") +
                 "_al_" + formatDDMMYYYY(dateGiorniCorrenti[4]).replace(/\//g,"-") + suffissoFile + ".docx";
    a.click();

    const divAvviso = document.getElementById('avvisoNonCompilate');
    if (elencoNonCompilate.length > 0) {
      divAvviso.textContent = "Attenzione: le seguenti attività non erano state compilate nel form e sono state inserite con i soli dati grezzi dell'Excel:\n" +
        elencoNonCompilate.map(x => "- " + x).join("\n");
    } else {
      divAvviso.textContent = "";
    }
  }).catch(function(err) {
    alert("Errore nella generazione: " + err.message);
  });
}

document.getElementById('btnGenera').onclick = function() { generaDocumento(true, null); };
document.getElementById('btnGeneraSezione').onclick = function() {
  if (sezioniSelezionate.size !== 1) return; // il pulsante non dovrebbe nemmeno essere visibile in questo caso
  generaDocumento(false, Array.from(sezioniSelezionate)[0]);
};
</script>
