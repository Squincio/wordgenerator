<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Generatore Programma Settimanale</title>
<script src="xlsx.full.min.js"></script>
<script src="docx.umd.js"></script>
<style>
  :root {
    --bg: #f2f4f3;
    --panel: #ffffff;
    --ink: #1c2530;
    --ink-soft: #5c6773;
    --line: #dde1e3;
    --navy: #1f3346;
    --steel: #3e6680;
    --steel-soft: #eaf0f4;
    --amber: #c98a3b;
    --amber-soft: #fbf2e4;
    --green: #3f7d4f;
    --green-soft: #eef7f0;
    --red: #a8402f;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    padding-bottom: 60px;
  }

  header.app-bar {
    background: var(--navy);
    color: #fff;
    padding: 22px 32px;
    margin-bottom: 28px;
  }
  header.app-bar h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: 0.2px; }
  header.app-bar p { margin: 4px 0 0; font-size: 13px; color: #b7c3cd; }

  main { max-width: 960px; margin: 0 auto; padding: 0 32px; }

  .step {
    display: flex;
    gap: 16px;
    margin-bottom: 22px;
  }
  .step-num {
    flex: none;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--steel);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    margin-top: 2px;
  }
  .step-body { flex: 1; min-width: 0; }
  .step-title { font-size: 15px; font-weight: 600; margin-bottom: 10px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px 18px;
  }

  input[type="file"], input[type="date"] {
    font-size: 13px;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
  }
  label { color: var(--ink-soft); font-size: 13px; }

  .settimana-giorni { display: flex; gap: 10px; margin-top: 14px; }
  .giorno-box {
    flex: 1; text-align: center; padding: 10px 6px;
    border: 1px solid var(--line); border-left: 3px solid var(--line);
    border-radius: 6px; background: #fafbfb; font-size: 13px; color: var(--ink-soft);
  }
  .giorno-box.oggi {
    background: var(--amber-soft); border-left: 3px solid var(--amber);
    color: var(--ink); font-weight: 600;
  }

  .sezioni-tabs { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .sezione-tab {
    padding: 7px 14px; border: 1px solid var(--line); border-radius: 999px;
    cursor: pointer; background: #fff; font-size: 13px; color: var(--ink-soft);
    transition: background 0.12s, color 0.12s, border-color 0.12s;
  }
  .sezione-tab:hover { border-color: var(--steel); color: var(--steel); }
  .sezione-tab.attiva { background: var(--steel); color: white; border-color: var(--steel); }

  .griglia-giorni { display: flex; gap: 10px; margin-top: 18px; }
  .giorno-cella {
    flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px;
    padding: 10px; min-height: 90px; background: var(--panel);
  }
  .giorno-cella.oggi { background: var(--amber-soft); border-color: #e9d3ac; }
  .giorno-cella h4 {
    margin: 0 0 8px 0; font-size: 12px; font-weight: 600; color: var(--ink-soft);
    text-transform: none; letter-spacing: 0.2px;
  }
  .attivita-item {
    font-size: 12.5px; background: #fff; border: 1px solid var(--line);
    border-left: 3px solid var(--steel); border-radius: 5px;
    padding: 7px 8px; margin-bottom: 6px; cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }
  .attivita-item:hover { background: var(--steel-soft); }
  .attivita-item.compilata { border-left: 3px solid var(--green); background: var(--green-soft); }
  .attivita-item b { color: var(--ink); }
  .attivita-item .segno-ok { color: var(--green); font-weight: bold; float: right; }
  .nessuna { font-size: 12px; color: #9aa3ab; font-style: italic; }

  #avviso-scartate {
    color: var(--red); font-size: 13px; margin-top: 16px; white-space: pre-wrap;
    background: #fdf1ef; border: 1px solid #f0d3cd; border-radius: 6px; padding: 10px 12px;
  }
  #avviso-scartate:empty { display: none; padding: 0; border: none; }

  /* ===== MODALE FORM ATTIVITÀ ===== */
  #overlayModale {
    display: none; position: fixed; top:0; left:0; width:100%; height:100%;
    background: rgba(20,28,36,0.55); z-index: 1000; align-items: center; justify-content: center;
  }
  #overlayModale.aperto { display: flex; }
  #modaleForm {
    background: var(--panel); border-radius: 10px; padding: 26px 28px; width: 560px;
    max-height: 85vh; overflow-y: auto; box-shadow: 0 12px 40px rgba(0,0,0,0.25);
  }
  #modaleForm h3 {
    margin: 0 0 18px; font-size: 16px; font-weight: 600; color: var(--navy);
    padding-bottom: 12px; border-bottom: 1px solid var(--line);
  }
  .campo-form { margin-bottom: 14px; }
  .campo-form label { display:block; font-weight: 600; font-size: 12.5px; margin-bottom: 5px; color: var(--ink-soft); }
  .campo-form input[type=text], .campo-form select, .campo-form textarea {
    width: 100%; box-sizing: border-box; padding: 7px 9px; font-size: 13px;
    border: 1px solid var(--line); border-radius: 5px; color: var(--ink); background: #fff;
    font-family: inherit;
  }
  .campo-form input[type=text]:focus, .campo-form select:focus, .campo-form textarea:focus {
    outline: none; border-color: var(--steel); box-shadow: 0 0 0 3px var(--steel-soft);
  }
  .campo-form textarea { min-height: 60px; resize: vertical; }
  .scelta-radio { display: flex; gap: 16px; font-size: 13px; flex-wrap: wrap; }
  .scelta-radio label { font-weight: normal; display:flex; align-items:center; gap:5px; color: var(--ink); }
  .riga-doppia { display:flex; gap: 15px; }
  .riga-doppia .campo-form { flex:1; }
  .azioni-modale {
    display:flex; justify-content: flex-end; gap: 10px; margin-top: 22px;
    padding-top: 16px; border-top: 1px solid var(--line);
  }
  .azioni-modale button {
    padding: 8px 18px; border-radius: 6px; border: 1px solid transparent; cursor: pointer;
    font-size: 13px; font-weight: 500; font-family: inherit;
  }
  #btnSalva { background: var(--steel); color: white; }
  #btnSalva:hover { background: var(--navy); }
  #btnAnnulla { background: #fff; color: var(--ink-soft); border-color: var(--line); }
  #btnAnnulla:hover { background: #f4f5f5; }

  #btnGenera {
    padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer;
    font-size: 14px; font-weight: 600; font-family: inherit;
    background: var(--steel); color: white;
  }
  #btnGenera:hover { background: var(--navy); }
  #avvisoNonCompilate {
    margin-top: 14px; font-size: 13px; color: #8a6116; white-space: pre-wrap;
    background: var(--amber-soft); border: 1px solid #e9d3ac; border-radius: 6px; padding: 10px 12px;
  }
  #avvisoNonCompilate:empty { display: none; padding: 0; border: none; margin-top: 0; }
</style>
</head>
<body>

<header class="app-bar">
  <h1>Programma Settimanale — Generatore</h1>
  <p>Ufficio Tecnico Territoriale Armamenti Terrestri · Nettuno</p>
</header>

<main>

<div class="step">
  <div class="step-num">1</div>
  <div class="step-body">
    <div class="step-title">Carica il file Excel</div>
    <div class="panel">
      <input type="file" id="fileExcel" accept=".xlsx,.xls">
    </div>
  </div>
</div>

<div class="step">
  <div class="step-num">2</div>
  <div class="step-body">
    <div class="step-title">Seleziona la settimana</div>
    <div class="panel">
      <label>Scegli un giorno qualsiasi della settimana desiderata</label><br>
      <input type="date" id="dataRiferimento" style="margin-top:6px;">
      <div class="settimana-giorni" id="boxSettimana"></div>
    </div>
  </div>
</div>

<div class="step">
  <div class="step-num">3</div>
  <div class="step-body">
    <div class="step-title">Seleziona la sezione</div>
    <div class="sezioni-tabs" id="tabsSezioni"></div>
    <div class="griglia-giorni" id="grigliaGiorni"></div>
    <div id="avviso-scartate"></div>
  </div>
</div>

<div class="step">
  <div class="step-num">4</div>
  <div class="step-body">
    <div class="step-title">Genera il documento Word</div>
    <div class="panel">
      <button id="btnGenera">Genera documento Word</button>
      <div id="avvisoNonCompilate"></div>
    </div>
  </div>
</div>

</main>

<!-- ===== MODALE FORM ATTIVITÀ ===== -->
<div id="overlayModale">
  <div id="modaleForm">
    <h3>Dettaglio attività</h3>

    <div class="riga-doppia">
      <div class="campo-form">
        <label>Tipologia</label>
        <select id="campoTipologia">
          <option value="CT">CT</option>
          <option value="AD">AD</option>
        </select>
      </div>
      <div class="campo-form">
        <label>Ditta</label>
        <select id="campoDittaSelect">
          <option value="Leonardo s.p.a.">Leonardo s.p.a.</option>
          <option value="KNDS Ammo Italy S.p.A.">KNDS Ammo Italy S.p.A.</option>
          <option value="ELT">ELT</option>
          <option value="MES">MES</option>
          <option value="Rheinmetall Italia S.p.A:">Rheinmetall Italia S.p.A:</option>
          <option value="altro">Altro (specifica)...</option>
        </select>
        <input type="text" id="campoDittaAltro" placeholder="Nome ditta" style="display:none; margin-top:6px;">
      </div>
    </div>

    <div class="campo-form">
      <label>Titolo</label>
      <input type="text" id="campoTitolo">
    </div>

    <div class="campo-form">
      <label>Descrizione Attività</label>
      <textarea id="campoDescrizione"></textarea>
    </div>

    <div class="campo-form">
      <label>Btr / Linea di Tiro</label>
      <input type="text" id="campoBtr">
    </div>

    <div class="campo-form">
      <label>Squadra emergenze</label>
      <div class="scelta-radio">
        <label><input type="radio" name="squadraEmergenze" value="disposizione"> A disposizione</label>
        <label><input type="radio" name="squadraEmergenze" value="non_necessaria"> Non necessaria</label>
      </div>
    </div>

    <div class="campo-form">
      <label>Rep. Artificieri</label>
      <div class="scelta-radio">
        <label><input type="radio" name="repArtificieri" value="in_btr"> In btr</label>
        <label><input type="radio" name="repArtificieri" value="non_presente"> Non presente</label>
      </div>
    </div>

    <div class="campo-form">
      <label>Rep. Armamento</label>
      <div class="scelta-radio">
        <label><input type="radio" name="repArmamento" value="in_btr"> In btr</label>
        <label><input type="radio" name="repArmamento" value="non_presente"> Non presente</label>
      </div>
    </div>

    <div class="campo-form">
      <label>Rep. Osservatori</label>
      <div class="scelta-radio">
        <label><input type="radio" name="repOsservatori" value="in_btr"> In btr</label>
        <label><input type="radio" name="repOsservatori" value="non_presente"> Non presente</label>
      </div>
    </div>

    <div class="campo-form">
      <label>Sez. Metrobalistica</label>
      <div class="scelta-radio">
        <label><input type="radio" name="sezMetrobalistica" value="in_btr"> In btr</label>
        <label><input type="radio" name="sezMetrobalistica" value="non_presente"> Non presente</label>
      </div>
    </div>

    <div class="riga-doppia">
      <div class="campo-form">
        <label>POS</label>
        <input type="text" id="campoPos">
      </div>
      <div class="campo-form">
        <label>SIC</label>
        <input type="text" id="campoSic">
      </div>
    </div>

    <div class="campo-form">
      <label>Assetti sanitari</label>
      <div class="scelta-radio">
        <label><input type="radio" name="assettiSanitari" value="ditta"> A cura Ditta</label>
        <label><input type="radio" name="assettiSanitari" value="no"> No</label>
      </div>
    </div>

    <div class="campo-form">
      <label>Sgombero</label>
      <div class="scelta-radio">
        <label><input type="checkbox" id="sgomberoTerra"> Terra</label>
        <label><input type="checkbox" id="sgomberoMare"> Mare</label>
      </div>
      <div class="scelta-radio" style="margin-top:8px;">
        <label><input type="radio" name="sgomberoCura" value="ditta"> A cura Ditta</label>
        <label><input type="radio" name="sgomberoCura" value="no"> No</label>
      </div>
    </div>

    <div class="azioni-modale">
      <button id="btnAnnulla">Annulla</button>
      <button id="btnSalva">Salva</button>
    </div>
  </div>
</div>

<script>
// ===================== MAPPING SEZIONI =====================
const MAPPING_SEZIONI = {
  "Artiglierie Terrestri": "ARTIGLIERIE",
  "Carri e Blindo": "CARRI_BLINDO",
  "Mortai, Armi C/C e C/A": "MORTAI",
  "Impianti": "IMPIANTI",
  "CSSN NEA": "NEA"
};
const NOMI_SEZIONI = {
  "ARTIGLIERIE": "SEZIONE ARTIGLIERIE TERRESTRI",
  "CARRI_BLINDO": "SEZIONE CARRI E BLINDO",
  "MORTAI": "SEZIONE MORTAI, ARMI C/C E C/A",
  "IMPIANTI": "SEZIONE IMPIANTI",
  "NEA": "NEA"
};

let datiRaggruppati = null;   // risultato di filtraERaggruppa
let dateGiorniCorrenti = [];  // le 5 date (Lun-Ven) della settimana selezionata
let sezioneSelezionata = "ARTIGLIERIE";
let formSalvati = {};         // chiave univoca -> dati compilati dal form
let chiaveAttivitaAperta = null; // chiave dell'attività attualmente aperta nella modale

function chiaveUnivoca(sezione, giornoIndex, attivitaIndex) {
  return sezione + "_" + giornoIndex + "_" + attivitaIndex;
}

// ===================== UTILITY DATE =====================
function getMondayOfWeek(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = (day === 0) ? -6 : (1 - day);
  date.setDate(date.getDate() + diff);
  date.setHours(0, 0, 0, 0);
  return date;
}
function formatDDMM(d) {
  return String(d.getDate()).padStart(2,'0') + "/" + String(d.getMonth()+1).padStart(2,'0');
}
function formatDDMMYYYY(d) {
  return String(d.getDate()).padStart(2,'0') + "/" + String(d.getMonth()+1).padStart(2,'0') + "/" + d.getFullYear();
}
function stessoGiorno(d1, d2) {
  return d1.getFullYear()===d2.getFullYear() && d1.getMonth()===d2.getMonth() && d1.getDate()===d2.getDate();
}

// ===================== PARSING E RAGGRUPPAMENTO =====================
function parseDataDesiderata(valoreCella) {
  if (!valoreCella) return null;

  // Caso 1: è già un oggetto Date (Excel con vera data, letta con cellDates:true)
  if (valoreCella instanceof Date) {
    const d = new Date(valoreCella);
    d.setHours(0,0,0,0);
    return isNaN(d.getTime()) ? null : d;
  }

  // Caso 2: è un numero seriale Excel (data letta senza cellDates, fallback di sicurezza)
  if (typeof valoreCella === "number") {
    const d = new Date(Math.round((valoreCella - 25569) * 86400 * 1000));
    d.setHours(0,0,0,0);
    return isNaN(d.getTime()) ? null : d;
  }

  // Caso 3: è testo tipo "31/08/2026 - lunedì"
  const match = String(valoreCella).match(/(\d{2})\/(\d{2})\/(\d{4})/);
  if (!match) return null;
  const [, gg, mm, yyyy] = match;
  const d = new Date(parseInt(yyyy), parseInt(mm)-1, parseInt(gg));
  d.setHours(0,0,0,0);
  return d;
}

function filtraERaggruppa(righeExcel, dateGiorniSettimana) {
  const risultato = {};
  Object.values(MAPPING_SEZIONI).forEach(cod => { risultato[cod] = [[],[],[],[],[]]; });
  const scartate = [];

  righeExcel.forEach(riga => {
    const dataAttivita = parseDataDesiderata(riga["Data desiderata"]);
    if (!dataAttivita) { scartate.push({motivo:"data non valida", riga}); return; }

    const indiceGiorno = dateGiorniSettimana.findIndex(d => stessoGiorno(d, dataAttivita));
    if (indiceGiorno === -1) return; // fuori settimana: normale, non è un "errore", si ignora silenziosamente

    const valoreSezione = String(riga["Sezione interessata"] || "").trim();
    const codiceSezione = MAPPING_SEZIONI[valoreSezione];
    if (!codiceSezione) { scartate.push({motivo:"sezione non riconosciuta: '"+valoreSezione+"'", riga}); return; }

    risultato[codiceSezione][indiceGiorno].push(riga);
  });

  return { risultato, scartate };
}

// ===================== LETTURA FILE EXCEL =====================
let righeExcelGlobali = [];

document.getElementById('fileExcel').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array', cellDates:true});
    const foglio = wb.Sheets[wb.SheetNames[0]];
    righeExcelGlobali = XLSX.utils.sheet_to_json(foglio);
    aggiornaTutto();
  };
  reader.readAsArrayBuffer(file);
});

// ===================== SELETTORE SETTIMANA =====================
const inputData = document.getElementById('dataRiferimento');

// Default: lunedì della prossima settimana
const oggi = new Date();
const lunediProssimo = getMondayOfWeek(oggi);
lunediProssimo.setDate(lunediProssimo.getDate() + 7);
inputData.valueAsDate = lunediProssimo;

inputData.addEventListener('change', aggiornaTutto);

function calcolaGiorniSettimana() {
  const riferimento = inputData.valueAsDate || new Date();
  const lunedi = getMondayOfWeek(riferimento);
  const giorni = [];
  for (let i=0; i<5; i++) {
    const d = new Date(lunedi);
    d.setDate(d.getDate()+i);
    giorni.push(d);
  }
  return giorni;
}

function disegnaBoxSettimana() {
  const box = document.getElementById('boxSettimana');
  const nomi = ["LUN","MAR","MER","GIO","VEN"];
  const oggiReale = new Date(); oggiReale.setHours(0,0,0,0);
  box.innerHTML = "";
  dateGiorniCorrenti.forEach((d, i) => {
    const div = document.createElement('div');
    div.className = "giorno-box" + (stessoGiorno(d, oggiReale) ? " oggi" : "");
    div.textContent = nomi[i] + " " + formatDDMM(d);
    box.appendChild(div);
  });
}

// ===================== TABS SEZIONI =====================
function disegnaTabsSezioni() {
  const cont = document.getElementById('tabsSezioni');
  cont.innerHTML = "";
  Object.entries(NOMI_SEZIONI).forEach(([codice, nomeLungo]) => {
    const div = document.createElement('div');
    div.className = "sezione-tab" + (codice === sezioneSelezionata ? " attiva" : "");
    const count = datiRaggruppati ? datiRaggruppati.risultato[codice].reduce((a,g)=>a+g.length,0) : 0;
    div.textContent = nomeLungo + " (" + count + ")";
    div.onclick = function() { sezioneSelezionata = codice; aggiornaVisualizzazione(); };
    cont.appendChild(div);
  });
}

// ===================== GRIGLIA GIORNI PER SEZIONE SELEZIONATA =====================
function disegnaGrigliaGiorni() {
  const cont = document.getElementById('grigliaGiorni');
  cont.innerHTML = "";
  const nomi = ["LUNEDÌ","MARTEDÌ","MERCOLEDÌ","GIOVEDÌ","VENERDÌ"];
  const oggiReale = new Date(); oggiReale.setHours(0,0,0,0);

  const attivitaPerGiorno = datiRaggruppati ? datiRaggruppati.risultato[sezioneSelezionata] : [[],[],[],[],[]];

  dateGiorniCorrenti.forEach((d, i) => {
    const div = document.createElement('div');
    div.className = "giorno-cella" + (stessoGiorno(d, oggiReale) ? " oggi" : "");
    let html = "<h4>" + nomi[i] + " " + formatDDMM(d) + "</h4>";
    const lista = attivitaPerGiorno[i];
    if (lista.length === 0) {
      html += "<div class='nessuna'>Nessuna attività</div>";
      div.innerHTML = html;
    } else {
      div.innerHTML = html;
      lista.forEach((a, indiceAttivita) => {
        const chiave = chiaveUnivoca(sezioneSelezionata, i, indiceAttivita);
        const compilata = !!formSalvati[chiave];
        const itemDiv = document.createElement('div');
        itemDiv.className = "attivita-item" + (compilata ? " compilata" : "");
        itemDiv.innerHTML = "<b>" + (a["DITTA"]||"") + "</b>" + (compilata ? "<span class='segno-ok'>&#10003;</span>" : "") +
                             "<br>" + (a["Descrizione Attività"]||"");
        itemDiv.onclick = function() { apriModale(sezioneSelezionata, i, indiceAttivita, a); };
        div.appendChild(itemDiv);
      });
    }
    cont.appendChild(div);
  });
}

function disegnaAvvisoScartate() {
  const div = document.getElementById('avviso-scartate');
  if (!datiRaggruppati || datiRaggruppati.scartate.length === 0) { div.textContent = ""; return; }
  let testo = "Righe ignorate durante la lettura:\n";
  datiRaggruppati.scartate.forEach(s => {
    testo += "- " + s.motivo + " (Ditta: " + (s.riga["DITTA"]||"?") + ")\n";
  });
  div.textContent = testo;
}

// ===================== GESTIONE MODALE FORM =====================
function apriModale(sezione, giornoIndex, attivitaIndex, rigaExcel) {
  chiaveAttivitaAperta = chiaveUnivoca(sezione, giornoIndex, attivitaIndex);
  const overlay = document.getElementById('overlayModale');

  const salvatoPrecedente = formSalvati[chiaveAttivitaAperta];

  if (salvatoPrecedente) {
    // Ricarico i valori salvati in precedenza
    document.getElementById('campoTipologia').value = salvatoPrecedente.tipologia;
    impostaDitta(salvatoPrecedente.ditta);
    document.getElementById('campoTitolo').value = salvatoPrecedente.titolo;
    document.getElementById('campoDescrizione').value = salvatoPrecedente.descrizione;
    document.getElementById('campoBtr').value = salvatoPrecedente.btr;
    impostaRadio('squadraEmergenze', salvatoPrecedente.squadraEmergenze);
    impostaRadio('repArtificieri', salvatoPrecedente.repArtificieri);
    impostaRadio('repArmamento', salvatoPrecedente.repArmamento);
    impostaRadio('repOsservatori', salvatoPrecedente.repOsservatori);
    impostaRadio('sezMetrobalistica', salvatoPrecedente.sezMetrobalistica);
    document.getElementById('campoPos').value = salvatoPrecedente.pos;
    document.getElementById('campoSic').value = salvatoPrecedente.sic;
    impostaRadio('assettiSanitari', salvatoPrecedente.assettiSanitari);
    document.getElementById('sgomberoTerra').checked = salvatoPrecedente.sgomberoTerra;
    document.getElementById('sgomberoMare').checked = salvatoPrecedente.sgomberoMare;
    impostaRadio('sgomberoCura', salvatoPrecedente.sgomberoCura);
  } else {
    // Precompilo dai dati Excel, resto vuoto/default
    const tipologiaExcel = normalizzaSpazi(rigaExcel["Tipologia"]).toUpperCase();
    document.getElementById('campoTipologia').value = (tipologiaExcel === "AD") ? "AD" : "CT";
    impostaDitta(rigaExcel["DITTA"]);
    document.getElementById('campoTitolo').value = rigaExcel["Descrizione Attività"] || "";
    document.getElementById('campoDescrizione').value = "";
    document.getElementById('campoBtr').value = rigaExcel["Btr/Linea di Tiro/commenti"] || "";
    impostaRadio('squadraEmergenze', null);
    impostaRadio('repArtificieri', null);
    impostaRadio('repArmamento', null);
    impostaRadio('repOsservatori', null);
    impostaRadio('sezMetrobalistica', null);
    document.getElementById('campoPos').value = "";
    document.getElementById('campoSic').value = "";
    impostaRadio('assettiSanitari', null);
    document.getElementById('sgomberoTerra').checked = false;
    document.getElementById('sgomberoMare').checked = false;
    impostaRadio('sgomberoCura', null);
  }

  overlay.classList.add('aperto');
}

function impostaRadio(nome, valore) {
  document.getElementsByName(nome).forEach(r => { r.checked = (r.value === valore); });
}
function leggiRadio(nome) {
  const scelto = Array.from(document.getElementsByName(nome)).find(r => r.checked);
  return scelto ? scelto.value : null;
}

const DITTE_FISSE = ["Leonardo s.p.a.", "KNDS Ammo Italy S.p.A.", "ELT", "MES", "Rheinmetall Italia S.p.A:"];

function normalizzaSpazi(testo) {
  return String(testo || "").replace(/\s+/g, ' ').trim();
}

function impostaDitta(valoreDitta) {
  const valoreNormalizzato = normalizzaSpazi(valoreDitta);
  const corrispondenza = DITTE_FISSE.find(d => normalizzaSpazi(d) === valoreNormalizzato);
  const select = document.getElementById('campoDittaSelect');
  const inputAltro = document.getElementById('campoDittaAltro');
  if (corrispondenza) {
    select.value = corrispondenza;
    inputAltro.style.display = "none";
    inputAltro.value = "";
  } else {
    select.value = "altro";
    inputAltro.style.display = "block";
    inputAltro.value = valoreDitta || "";
  }
}

function leggiDitta() {
  const select = document.getElementById('campoDittaSelect');
  if (select.value === "altro") {
    return document.getElementById('campoDittaAltro').value;
  }
  return select.value;
}

document.getElementById('campoDittaSelect').addEventListener('change', function() {
  document.getElementById('campoDittaAltro').style.display = (this.value === "altro") ? "block" : "none";
});

function chiudiModale() {
  document.getElementById('overlayModale').classList.remove('aperto');
  chiaveAttivitaAperta = null;
}

document.getElementById('btnAnnulla').onclick = chiudiModale;

document.getElementById('btnSalva').onclick = function() {
  if (!chiaveAttivitaAperta) return;
  formSalvati[chiaveAttivitaAperta] = {
    tipologia: document.getElementById('campoTipologia').value,
    ditta: leggiDitta(),
    titolo: document.getElementById('campoTitolo').value,
    descrizione: document.getElementById('campoDescrizione').value,
    btr: document.getElementById('campoBtr').value,
    squadraEmergenze: leggiRadio('squadraEmergenze'),
    repArtificieri: leggiRadio('repArtificieri'),
    repArmamento: leggiRadio('repArmamento'),
    repOsservatori: leggiRadio('repOsservatori'),
    sezMetrobalistica: leggiRadio('sezMetrobalistica'),
    pos: document.getElementById('campoPos').value,
    sic: document.getElementById('campoSic').value,
    assettiSanitari: leggiRadio('assettiSanitari'),
    sgomberoTerra: document.getElementById('sgomberoTerra').checked,
    sgomberoMare: document.getElementById('sgomberoMare').checked,

  };
  chiudiModale();

};

function aggiornaTutto() {

function aggiornaVisualizzazione() {

// Inizializzazione all'avvio pagina
dateGiorniCorrenti = calcolaGiorniSettimana();
disegnaBoxSettimana();
disegnaTabsSezioni();
disegnaGrigliaGiorni();

// ===================== GENERAZIONE DOCUMENTO WORD =====================
const {
  Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell,
  WidthType, BorderStyle, ShadingType, VerticalAlign, AlignmentType,
  HeightRule, TabStopType, PageOrientation
} = docx;

const LARGHEZZE_COLONNE = [568, 425, 2069, 2070, 2098, 1985, 2126];
const GRIGIO_CHIARO = { type: ShadingType.PERCENT_10, color: "auto", fill: "auto" };
const BORDO = {
  top:    { style: BorderStyle.SINGLE, size: 4, color: "000000" },
  bottom: { style: BorderStyle.SINGLE, size: 4, color: "000000" },
  left:   { style: BorderStyle.SINGLE, size: 4, color: "000000" },
  right:  { style: BorderStyle.SINGLE, size: 4, color: "000000" },
};
const LARGHEZZA_LABEL = LARGHEZZE_COLONNE[0] + LARGHEZZE_COLONNE[1];
const LARGHEZZE_GIORNI = LARGHEZZE_COLONNE.slice(2);

function cellaLabel(testo, colSpan, rowSpanInfo, larghezza) {
  return new TableCell({
    columnSpan: colSpan || 1,
    verticalMerge: rowSpanInfo,
    verticalAlign: VerticalAlign.CENTER,
    shading: GRIGIO_CHIARO,
    borders: BORDO,
    width: { size: larghezza, type: WidthType.DXA },
    children: [
      new Paragraph({
        alignment: AlignmentType.CENTER,
        children: testo.split("\n").map((riga, idx) =>
          new TextRun({ text: riga, bold: true, size: 12, font: "Times New Roman", break: idx > 0 ? 1 : 0 })
        )
      })
    ]
  });
}

function cellaGiorno(nomeGiorno, dataGiorno, larghezza) {
  return new TableCell({
    verticalAlign: VerticalAlign.CENTER,
    shading: GRIGIO_CHIARO,
    borders: BORDO,
    width: { size: larghezza, type: WidthType.DXA },
    children: [
      new Paragraph({
        alignment: AlignmentType.CENTER,
        children: [
          new TextRun({ text: nomeGiorno, bold: true, underline: {}, size: 12, font: "Times New Roman" }),
          new TextRun({ text: dataGiorno, bold: false, size: 12, font: "Times New Roman", break: 1 })
        ]
      })
    ]
  });
}

function cellaDato(larghezza, paragrafi) {
  return new TableCell({
    borders: BORDO,
    width: { size: larghezza, type: WidthType.DXA },
    children: (paragrafi && paragrafi.length) ? paragrafi : [ new Paragraph({ children: [] }) ]
  });
}

function altezzaRiga(dxa) {
  return { value: dxa, rule: HeightRule.ATLEAST };
}

// Righe della tabella nell'ordine originale, con il codice sezione corrispondente (null = mai da Excel)
const RIGHE_TABELLA = [
  { nome: "SEZIONE ARTIGLIERIE TERRESTRI", altezza: 3964, codice: "ARTIGLIERIE" },
  { nome: "SEZIONE CARRI E BLINDO", altezza: 327, codice: "CARRI_BLINDO" },
  { nome: "SEZIONE MORTAI, ARMI C/C E C/A", altezza: 121, codice: "MORTAI" },
  { nome: "NEA", altezza: 121, codice: "NEA" },
  { nome: "SEZIONE\nIMPIANTI", altezza: 123, codice: "IMPIANTI" },
  { nome: "SERVIZIO POLIGONO DI SANTA SEVERA", altezza: 123, codice: null },
];

// ===================== COMPOSIZIONE TESTO CELLA (regole di formattazione) =====================
const ETICHETTE_REP = {
  repArtificieri: "Rep. Artificieri",
  repArmamento: "Rep. Armamento",
  repOsservatori: "Rep. Osservatori",
  sezMetrobalistica: "Sez. Metrobalistica"
};
const DIM_TESTO_CELLA = 13; // 6.5pt
const FONT_CELLA = "Times New Roman";

function runCella(testo, opts) {
  opts = opts || {};
  return new TextRun({
    text: testo, bold: !!opts.bold, underline: opts.underline ? {} : undefined,
    size: DIM_TESTO_CELLA, font: FONT_CELLA
  });
}
function terminaFrase(testo) {
  return testo.endsWith(".") ? testo : testo + ".";
}

function componiAttivita(dati) {
  const paragrafi = [];

  paragrafi.push(new Paragraph({
    children: [ runCella(`${dati.tipologia} ${dati.ditta} – ${dati.titolo}`.trim(), { bold: true }) ]
  }));

  let contenutoRiga2 = [];
  function aggiungiSegmento(nuoviRuns) {
    if (contenutoRiga2.length > 0) contenutoRiga2.push(runCella(" "));
    contenutoRiga2 = contenutoRiga2.concat(nuoviRuns);
  }
  if (dati.descrizione && dati.descrizione.trim()) {
    aggiungiSegmento([ runCella(dati.descrizione.trim()) ]);
  }
  if (dati.squadraEmergenze === "disposizione") {
    aggiungiSegmento([ runCella("Squadra emergenze:", { underline: true }), runCella(" a disposizione.") ]);
  }
  Object.keys(ETICHETTE_REP).filter(k => dati[k] === "in_btr").forEach(k => {
    aggiungiSegmento([ runCella(ETICHETTE_REP[k] + ":", { underline: true }), runCella(" in btr.") ]);
  });
  if (contenutoRiga2.length > 0) {
    paragrafi.push(new Paragraph({ children: contenutoRiga2 }));
  }

  if ((dati.pos && dati.pos.trim()) || (dati.sic && dati.sic.trim())) {
    let testo = "";
    if (dati.pos && dati.pos.trim()) testo += "POS = " + dati.pos.trim();
    if (dati.sic && dati.sic.trim()) testo += (testo ? " - " : "") + "SIC = " + dati.sic.trim();
    paragrafi.push(new Paragraph({ children: [ runCella(testo, { bold: true }) ] }));
  }

  if (dati.btr && dati.btr.trim()) {
    paragrafi.push(new Paragraph({ children: [ runCella("Btr " + dati.btr.trim(), { bold: true }) ] }));
  }

  const sanitariPresente = dati.assettiSanitari === "ditta";
  const sgomberoPresente = dati.sgomberoTerra || dati.sgomberoMare;
  const sgomberoCuraDitta = dati.sgomberoCura === "ditta";
  const doveSgombero = (dati.sgomberoTerra && dati.sgomberoMare) ? "a terra e mare" : (dati.sgomberoTerra ? "a terra" : "a mare");

  const righeAssetti = [];
  if (sanitariPresente && sgomberoPresente && sgomberoCuraDitta) {
    righeAssetti.push(terminaFrase("Assetti per assistenza sanitaria e sgombero " + doveSgombero + " a cura " + dati.ditta));
  } else {
    if (sanitariPresente) righeAssetti.push(terminaFrase("Assetti per assistenza sanitaria a cura " + dati.ditta));
    if (sgomberoPresente) {
      let riga = "Sgombero " + doveSgombero;
      if (sgomberoCuraDitta) riga += " a cura " + dati.ditta;
      righeAssetti.push(terminaFrase(riga));
    }
  }
  if (righeAssetti.length > 0) {
    paragrafi.push(new Paragraph({ children: [] }));
    righeAssetti.forEach(r => paragrafi.push(new Paragraph({ children: [ runCella(r, { bold: true }) ] })));
  }

  return paragrafi;
}

function componiCella(listaAttivita) {
  if (!listaAttivita || listaAttivita.length === 0) {
    return [ new Paragraph({ children: [] }) ];
  }
  let paragrafi = [];
  listaAttivita.forEach((attivita, idx) => {
    if (idx > 0) paragrafi.push(new Paragraph({ children: [] }));
    paragrafi = paragrafi.concat(componiAttivita(attivita));
  });
  return paragrafi;
}

// ===================== RACCOLTA DATI PER OGNI CELLA (formSalvati oppure bozza da Excel) =====================
function datiAttivitaPerCella(codiceSezione, giornoIndex, elencoNonCompilate) {
  if (!codiceSezione || !datiRaggruppati || !datiRaggruppati.risultato[codiceSezione]) return [];
  const righeGrezze = datiRaggruppati.risultato[codiceSezione][giornoIndex] || [];
  return righeGrezze.map((rigaExcel, idx) => {
    const chiave = chiaveUnivoca(codiceSezione, giornoIndex, idx);
    const salvato = formSalvati[chiave];
    if (salvato) return salvato;

    // Fallback: nessun form compilato per questa attività, uso una bozza minima dall'Excel
    elencoNonCompilate.push((rigaExcel["DITTA"] || "Ditta sconosciuta") + " — " + NOMI_SEZIONI[codiceSezione] + " (" + ["LUN","MAR","MER","GIO","VEN"][giornoIndex] + ")");
    const tipologiaExcel = normalizzaSpazi(rigaExcel["Tipologia"]).toUpperCase();
    return {
      tipologia: (tipologiaExcel === "AD") ? "AD" : "CT",
      ditta: rigaExcel["DITTA"] || "",
      titolo: rigaExcel["Descrizione Attività"] || "",
      descrizione: "",
      btr: rigaExcel["Btr/Linea di Tiro/commenti"] || "",
      squadraEmergenze: null, repArtificieri: null, repArmamento: null, repOsservatori: null, sezMetrobalistica: null,
      pos: "", sic: "", assettiSanitari: null, sgomberoTerra: false, sgomberoMare: false, sgomberoCura: null
    };
  });
}

// ===================== ASSEMBLAGGIO DOCUMENTO COMPLETO =====================
function generaDocumento() {
  if (!righeExcelGlobali || righeExcelGlobali.length === 0) {
    alert("Carica prima il file Excel (passaggio 1).");
    return;
  }

  const elencoNonCompilate = [];

  const giorniNomi = ["LUNEDÌ", "MARTEDÌ", "MERCOLEDÌ", "GIOVEDÌ", "VENERDÌ"];
  const rigaIntestazione = new TableRow({
    height: altezzaRiga(309),
    children: [
      cellaLabel("", 2, undefined, LARGHEZZA_LABEL),
      ...giorniNomi.map((nome, i) => cellaGiorno(nome, formatDDMM(dateGiorniCorrenti[i]), LARGHEZZE_GIORNI[i]))
    ]
  });

  const righeTabellaFinale = RIGHE_TABELLA.map(riga =>
    new TableRow({
      height: altezzaRiga(riga.altezza),
      children: [
        cellaLabel(riga.nome, 2, undefined, LARGHEZZA_LABEL),
        ...LARGHEZZE_GIORNI.map((larghezza, giornoIndex) => {
          const lista = datiAttivitaPerCella(riga.codice, giornoIndex, elencoNonCompilate);
          return cellaDato(larghezza, componiCella(lista));
        })
      ]
    })
  );

  const tabella = new Table({
    width: { size: LARGHEZZE_COLONNE.reduce((a,b) => a+b, 0), type: WidthType.DXA },
    columnWidths: LARGHEZZE_COLONNE,
    indent: { size: -289, type: WidthType.DXA },
    rows: [rigaIntestazione, ...righeTabellaFinale]
  });

  const spazioIniziale = new Paragraph({ text: "" });
  const titolo = new Paragraph({
    alignment: AlignmentType.CENTER,
    children: [ new TextRun({ text: "UFFICIO TECNICO TERRITORIALE ARMAMENTI TERRESTRI - NETTUNO", bold: true, size: 20, font: "Times New Roman" }) ]
  });
  const sottotitolo = new Paragraph({
    alignment: AlignmentType.CENTER,
    spacing: { after: 200 },
    children: [ new TextRun({
      text: "PROGRAMMA SETTIMANALE DEI TIRI E LAVORI DAL " + formatDDMMYYYY(dateGiorniCorrenti[0]) + " AL " + formatDDMMYYYY(dateGiorniCorrenti[4]),
      bold: true, size: 20, font: "Times New Roman"
    }) ]
  });
  const spazioDopoTabella = new Paragraph({ text: "", spacing: { before: 200 } });
  const rigaFirmeTitoli = new Paragraph({
    tabStops: [{ type: TabStopType.CENTER, position: 2694 }, { type: TabStopType.CENTER, position: 8080 }],
    children: [ new TextRun({ text: "\tIL CAPO SERVIZIO SUPPORTO TECNICO POLIGONO\tIL CAPO SERVIZIO POLIGONO", size: 16, font: "Times New Roman" }) ]
  });
  const rigaFirmeNomi = new Paragraph({
    tabStops: [{ type: TabStopType.CENTER, position: 2694 }, { type: TabStopType.CENTER, position: 8080 }],
    children: [ new TextRun({ text: "\tTen. Col. g. (gua) Francesco IODICE\tMagg. ing. Andrea DI MARIO", size: 16, font: "Times New Roman" }) ]
  });
  const spazioVisto = new Paragraph({ text: "", spacing: { before: 300 } });
  const rigaVisto = new Paragraph({ alignment: AlignmentType.CENTER, children: [ new TextRun({ text: "VISTO, si approva:", size: 16, font: "Times New Roman" }) ] });
  const rigaViceDirettore = new Paragraph({ alignment: AlignmentType.CENTER, children: [ new TextRun({ text: "IL VICE DIRETTORE", size: 16, font: "Times New Roman" }) ] });
  const rigaNomeVice = new Paragraph({ alignment: AlignmentType.CENTER, children: [ new TextRun({ text: "Ten. Col. ing. Francesco RUTIGLIANO", size: 16, font: "Times New Roman" }) ] });

  const doc = new Document({
    sections: [{
      properties: {
        page: {
          size: { width: 11906, height: 16838, orientation: PageOrientation.PORTRAIT },
          margin: { top: 180, bottom: 180, left: 567, right: 566 }
        }
      },
      children: [ spazioIniziale, titolo, sottotitolo, tabella, spazioDopoTabella, rigaFirmeTitoli, rigaFirmeNomi, spazioVisto, rigaVisto, rigaViceDirettore, rigaNomeVice ]
    }]
  });

  Packer.toBlob(doc).then(function(blob) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = "Settimanale_dal_" + formatDDMMYYYY(dateGiorniCorrenti[0]).replace(/\//g,"-") +
                 "_al_" + formatDDMMYYYY(dateGiorniCorrenti[4]).replace(/\//g,"-") + ".docx";
    a.click();

    const divAvviso = document.getElementById('avvisoNonCompilate');
    if (elencoNonCompilate.length > 0) {
      divAvviso.textContent = "Attenzione: le seguenti attività non erano state compilate nel form e sono state inserite con i soli dati grezzi dell'Excel:\n" +
        elencoNonCompilate.map(x => "- " + x).join("\n");
    } else {
      divAvviso.textContent = "";
    }
  }).catch(function(err) {
    alert("Errore nella generazione: " + err.message);

}

document.getElementById('btnGenera').onclick = generaDocumento;
